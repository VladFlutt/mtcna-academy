<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 275" font-family="sans-serif"><defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="10" y="90" width="120" height="56" rx="8" class="box"/><text x="70.0" y="114.0" text-anchor="middle" class="t">Packet</text><text x="70.0" y="132.0" text-anchor="middle" class="s">in from LAN</text><rect x="160" y="80" width="150" height="76" rx="8" class="rt"/><text x="235.0" y="105.0" text-anchor="middle" class="t">mangle</text><text x="235.0" y="123.0" text-anchor="middle" class="s">prerouting/output</text><text x="235.0" y="141.0" text-anchor="middle" class="s">mark-routing → table</text><rect x="340" y="80" width="160" height="76" rx="8" class="rt"/><text x="420.0" y="105.0" text-anchor="middle" class="t">/routing rule</text><text x="420.0" y="123.0" text-anchor="middle" class="s">top to bottom,</text><text x="420.0" y="141.0" text-anchor="middle" class="s">first match decides</text><rect x="540" y="20" width="140" height="50" rx="8" class="ok"/><text x="610.0" y="41.0" text-anchor="middle" class="t">table isp2</text><text x="610.0" y="59.0" text-anchor="middle" class="s">0.0.0.0/0 → ISP2</text><rect x="540" y="100" width="140" height="50" rx="8" class="ok"/><text x="610.0" y="121.0" text-anchor="middle" class="t">table main</text><text x="610.0" y="139.0" text-anchor="middle" class="s">0.0.0.0/0 → ISP1</text><rect x="540" y="180" width="140" height="50" rx="8" class="no"/><text x="610.0" y="201.0" text-anchor="middle" class="t">drop / unreachable</text><text x="610.0" y="219.0" text-anchor="middle" class="s">action of a rule</text><line x1="130" y1="118" x2="160" y2="118" class="ln" marker-end="url(#a5)"/><line x1="310" y1="118" x2="340" y2="118" class="ln" marker-end="url(#a5)"/><line x1="500" y1="105" x2="540" y2="50" class="ln" marker-end="url(#a5)"/><line x1="500" y1="118" x2="540" y2="124" class="ln" marker-end="url(#a5)"/><line x1="500" y1="135" x2="540" y2="200" class="ln" marker-end="url(#a5)"/><path d="M610,70 L610,98" class="ld" marker-end="url(#a5)"/><text x="535" y="250" text-anchor="start" class="s">lookup: an empty table falls</text><text x="535" y="264" text-anchor="start" class="s">through to main</text><text x="160" y="190" text-anchor="start" class="s">a routing mark from mangle → that table first</text><text x="160" y="214" text-anchor="start" class="s">v6: /ip route rule and routing-mark on the route</text></svg>
