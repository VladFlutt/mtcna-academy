<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 362" font-family="sans-serif"><defs><marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><ellipse cx="350" cy="90" rx="190" ry="62" class="rt"/><text x="350" y="70" text-anchor="middle" class="t">Area 0 (backbone)</text><text x="350" y="88" text-anchor="middle" class="s">every area attaches here</text><ellipse cx="120" cy="250" rx="110" ry="58" class="box"/><text x="120" y="240" text-anchor="middle" class="t">Area 1: stub</text><text x="120" y="258" text-anchor="middle" class="s">LSA 1, 2, 3 + default</text><ellipse cx="350" cy="275" rx="105" ry="55" class="box"/><text x="350" y="265" text-anchor="middle" class="t">Area 2: normal</text><text x="350" y="283" text-anchor="middle" class="s">LSA 1-5</text><ellipse cx="580" cy="250" rx="110" ry="58" class="box"/><text x="580" y="240" text-anchor="middle" class="t">Area 3: NSSA</text><text x="580" y="258" text-anchor="middle" class="s">LSA 1, 2, 3, 7</text><rect x="156" y="134" width="68" height="32" rx="8" class="wa"/><text x="190.0" y="155.0" text-anchor="middle" class="t">ABR</text><rect x="316" y="156" width="68" height="32" rx="8" class="wa"/><text x="350.0" y="177.0" text-anchor="middle" class="t">ABR</text><rect x="476" y="134" width="68" height="32" rx="8" class="wa"/><text x="510.0" y="155.0" text-anchor="middle" class="t">ABR</text><rect x="600" y="40" width="90" height="34" rx="8" class="no"/><text x="645.0" y="53.0" text-anchor="middle" class="t">ASBR</text><text x="645.0" y="71.0" text-anchor="middle" class="s">redistributes</text><rect x="560" y="300" width="90" height="30" rx="8" class="no"/><text x="605.0" y="320.0" text-anchor="middle" class="t">ASBR (7)</text><line x1="540" y1="70" x2="600" y2="60" class="lm"/><text x="350" y="352" text-anchor="middle" class="s">ABR: in two or more areas, summarises (LSA 3). ASBR: brings external routes in (LSA 5, or 7 in an NSSA).</text></svg>
