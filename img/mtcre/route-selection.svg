<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="sans-serif"><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="20" y="20" width="220" height="50" rx="8" class="rt"/><text x="130.0" y="41.0" text-anchor="middle" class="t">Packet to 10.1.1.20</text><text x="130.0" y="59.0" text-anchor="middle" class="s">dst-address lookup</text><text x="300" y="30" text-anchor="start" class="t">1. Which routes contain the address?</text><rect x="300" y="44" width="330" height="20" rx="4" class="ok"/><text x="310" y="58" text-anchor="start" class="mono">0.0.0.0/0</text><text x="430" y="58" text-anchor="start" class="mono">172.16.1.1</text><text x="620" y="58" text-anchor="end" class="mono">d=1</text><rect x="300" y="68" width="330" height="20" rx="4" class="ok"/><text x="310" y="82" text-anchor="start" class="mono">10.0.0.0/8</text><text x="430" y="82" text-anchor="start" class="mono">10.0.12.2</text><text x="620" y="82" text-anchor="end" class="mono">d=1</text><rect x="300" y="92" width="330" height="20" rx="4" class="ok"/><text x="310" y="106" text-anchor="start" class="mono">10.1.0.0/16</text><text x="430" y="106" text-anchor="start" class="mono">10.0.13.2</text><text x="620" y="106" text-anchor="end" class="mono">d=110</text><rect x="300" y="116" width="330" height="20" rx="4" class="ok"/><text x="310" y="130" text-anchor="start" class="mono">10.1.0.0/16</text><text x="430" y="130" text-anchor="start" class="mono">10.0.12.2</text><text x="620" y="130" text-anchor="end" class="mono">d=1</text><rect x="300" y="140" width="330" height="20" rx="4" class="ok"/><text x="310" y="154" text-anchor="start" class="mono">10.1.1.0/24</text><text x="430" y="154" text-anchor="start" class="mono">10.0.13.2, 10.0.12.2</text><text x="620" y="154" text-anchor="end" class="mono">d=1</text><rect x="300" y="164" width="330" height="20" rx="4" class="no"/><text x="310" y="178" text-anchor="start" class="mono">192.168.1.0/24</text><text x="430" y="178" text-anchor="start" class="mono">ether5</text><text x="620" y="178" text-anchor="end" class="mono">d=0</text><text x="640" y="58" text-anchor="start" class="s">✓ match</text><text x="640" y="178" text-anchor="start" class="s">✗ no match</text><line x1="130" y1="70" x2="130" y2="190" class="ln" marker-end="url(#a1)"/><text x="20" y="215" text-anchor="start" class="t">2. Longest prefix wins:</text><text x="20" y="233" text-anchor="start" class="s">/24 beats /16, /8 and /0,</text><text x="20" y="249" text-anchor="start" class="s">whatever their distance</text><rect x="300" y="200" width="330" height="60" rx="8" class="wa"/><text x="465.0" y="226.0" text-anchor="middle" class="t">10.1.1.0/24  distance 1</text><text x="465.0" y="244.0" text-anchor="middle" class="s">the only /24: selected</text><text x="20" y="290" text-anchor="start" class="t">3. Same prefix? Lowest distance.</text><text x="20" y="320" text-anchor="start" class="s">4. Several gateways or equal routes:</text><text x="20" y="336" text-anchor="start" class="s">ECMP, spread per connection.</text><rect x="300" y="280" width="330" height="56" rx="8" class="ok"/><text x="465.0" y="304.0" text-anchor="middle" class="t">ECMP: 10.0.13.2 + 10.0.12.2</text><text x="465.0" y="322.0" text-anchor="middle" class="s">both gateways are used</text><line x1="465" y1="260" x2="465" y2="278" class="ln" marker-end="url(#a1)"/></svg>
