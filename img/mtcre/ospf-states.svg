<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="sans-serif"><defs><marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="10" y="20" width="150" height="84" rx="8" class="rt"/><text x="85.0" y="58.0" text-anchor="middle" class="t">Down</text><text x="85.0" y="76.0" text-anchor="middle" class="s">no hello yet</text><line x1="160" y1="62" x2="182" y2="62" class="ln" marker-end="url(#a7)"/><rect x="182" y="20" width="150" height="84" rx="8" class="rt"/><text x="257.0" y="49.0" text-anchor="middle" class="t">Init</text><text x="257.0" y="67.0" text-anchor="middle" class="s">got a hello,</text><text x="257.0" y="85.0" text-anchor="middle" class="s">not listed in it</text><line x1="332" y1="62" x2="354" y2="62" class="ln" marker-end="url(#a7)"/><rect x="354" y="20" width="150" height="84" rx="8" class="wa"/><text x="429.0" y="49.0" text-anchor="middle" class="t">2-Way</text><text x="429.0" y="67.0" text-anchor="middle" class="s">sees itself in</text><text x="429.0" y="85.0" text-anchor="middle" class="s">neighbour's hello</text><line x1="504" y1="62" x2="526" y2="62" class="ln" marker-end="url(#a7)"/><rect x="526" y="20" width="150" height="84" rx="8" class="rt"/><text x="601.0" y="49.0" text-anchor="middle" class="t">ExStart</text><text x="601.0" y="67.0" text-anchor="middle" class="s">master/slave,</text><text x="601.0" y="85.0" text-anchor="middle" class="s">DD sequence</text><rect x="10" y="140" width="150" height="84" rx="8" class="rt"/><text x="85.0" y="169.0" text-anchor="middle" class="t">Exchange</text><text x="85.0" y="187.0" text-anchor="middle" class="s">DD packets</text><text x="85.0" y="205.0" text-anchor="middle" class="s">(LSDB summary)</text><line x1="160" y1="182" x2="182" y2="182" class="ln" marker-end="url(#a7)"/><rect x="182" y="140" width="150" height="84" rx="8" class="rt"/><text x="257.0" y="169.0" text-anchor="middle" class="t">Loading</text><text x="257.0" y="187.0" text-anchor="middle" class="s">LS requests</text><text x="257.0" y="205.0" text-anchor="middle" class="s">for missing LSAs</text><line x1="332" y1="182" x2="354" y2="182" class="ln" marker-end="url(#a7)"/><rect x="354" y="140" width="150" height="84" rx="8" class="ok"/><text x="429.0" y="178.0" text-anchor="middle" class="t">Full</text><text x="429.0" y="196.0" text-anchor="middle" class="s">LSDB synced</text><path d="M600,104 C600,130 90,110 90,138" class="ln" marker-end="url(#a7)"/><text x="350" y="250" text-anchor="middle" class="s">DROther routers on a broadcast segment stop at 2-Way with each other; that is normal.</text><text x="350" y="268" text-anchor="middle" class="s">Stuck in Init: one-way hellos. Stuck in ExStart/Exchange: usually an MTU mismatch.</text></svg>
