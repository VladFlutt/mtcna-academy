<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 315" font-family="sans-serif"><defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="20" y="20" width="150" height="48" rx="8" class="box"/><text x="95.0" y="40.0" text-anchor="middle" class="t">connected</text><text x="95.0" y="58.0" text-anchor="middle" class="s">distance 0</text><line x1="170" y1="44" x2="255" y2="140" class="lm" marker-end="url(#a2)"/><rect x="20" y="82" width="150" height="48" rx="8" class="box"/><text x="95.0" y="102.0" text-anchor="middle" class="t">static</text><text x="95.0" y="120.0" text-anchor="middle" class="s">distance 1</text><line x1="170" y1="106" x2="255" y2="140" class="lm" marker-end="url(#a2)"/><rect x="20" y="144" width="150" height="48" rx="8" class="box"/><text x="95.0" y="164.0" text-anchor="middle" class="t">OSPF</text><text x="95.0" y="182.0" text-anchor="middle" class="s">distance 110</text><line x1="170" y1="168" x2="255" y2="140" class="lm" marker-end="url(#a2)"/><rect x="20" y="206" width="150" height="48" rx="8" class="box"/><text x="95.0" y="226.0" text-anchor="middle" class="t">DHCP / PPP</text><text x="95.0" y="244.0" text-anchor="middle" class="s">dynamic</text><line x1="170" y1="230" x2="255" y2="140" class="lm" marker-end="url(#a2)"/><rect x="260" y="90" width="190" height="100" rx="8" class="rt"/><text x="355.0" y="118.0" text-anchor="middle" class="t">RIB</text><text x="355.0" y="136.0" text-anchor="middle" class="s">every route from every source</text><text x="355.0" y="154.0" text-anchor="middle" class="s">best per prefix is selected</text><text x="355.0" y="172.0" text-anchor="middle" class="mono">/ip route print</text><line x1="450" y1="140" x2="510" y2="140" class="ln" marker-end="url(#a2)"/><rect x="515" y="90" width="170" height="100" rx="8" class="ok"/><text x="600.0" y="118.0" text-anchor="middle" class="t">FIB</text><text x="600.0" y="136.0" text-anchor="middle" class="s">only active routes</text><text x="600.0" y="154.0" text-anchor="middle" class="s">used to forward</text><text x="600.0" y="172.0" text-anchor="middle" class="s">each packet</text><text x="350" y="285" text-anchor="middle" class="s">Routing filters, distance and check-gateway decide what reaches the FIB.</text><text x="350" y="303" text-anchor="middle" class="s">Packets are forwarded with the FIB; policy routing picks which table to look in.</text></svg>
