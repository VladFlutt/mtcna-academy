<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" font-family="sans-serif"><defs><marker id="na1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="10" y="90" width="120" height="100" rx="8" class="box"/><text x="70.0" y="135.0" text-anchor="middle" class="t">LAN host</text><text x="70.0" y="153.0" text-anchor="middle" class="s">192.168.88.10</text><rect x="250" y="50" width="200" height="150" rx="8" class="rt"/><text x="350" y="72" text-anchor="middle" class="t">Router</text><rect x="285" y="84" width="130" height="50" rx="8" class="ok"/><text x="350.0" y="104.0" text-anchor="middle" class="t">local process</text><text x="350.0" y="122.0" text-anchor="middle" class="s">Winbox, DNS, SSH</text><rect x="570" y="90" width="120" height="100" rx="8" class="box"/><text x="630.0" y="135.0" text-anchor="middle" class="t">Internet</text><text x="630.0" y="153.0" text-anchor="middle" class="s">ether1</text><line x1="130" y1="110" x2="285" y2="110" class="ln" marker-end="url(#na1)"/><text x="195" y="100" text-anchor="middle" class="t">input</text><line x1="130" y1="170" x2="568" y2="170" class="lb" marker-end="url(#na1)"/><text x="350" y="162" text-anchor="middle" class="t">forward</text><line x1="415" y1="110" x2="568" y2="110" class="lg" marker-end="url(#na1)"/><text x="500" y="100" text-anchor="middle" class="t">output</text><text x="350" y="26" text-anchor="middle" class="s">input: to the router · forward: through the router · output: from the router</text><text x="350" y="232" text-anchor="middle" class="s">Rules in each chain are checked top to bottom; the first match decides.</text><text x="350" y="252" text-anchor="middle" class="s">Protect the router with input, the networks behind it with forward.</text></svg>