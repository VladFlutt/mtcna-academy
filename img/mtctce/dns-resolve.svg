<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" font-family="sans-serif"><defs><marker id="tce1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="10" y="80" width="120" height="60" rx="8" class="box"/><text x="70.0" y="105.0" text-anchor="middle" class="t">LAN client</text><text x="70.0" y="123.0" text-anchor="middle" class="s">asks 192.168.33.1</text><rect x="170" y="20" width="170" height="190" rx="8" class="rt"/><text x="255" y="42" text-anchor="middle" class="t">RouterOS DNS</text><rect x="185" y="56" width="140" height="40" rx="8" class="ok"/><text x="255.0" y="71.0" text-anchor="middle" class="t">static</text><text x="255.0" y="89.0" text-anchor="middle" class="s">top to bottom</text><rect x="185" y="106" width="140" height="40" rx="8" class="ok"/><text x="255.0" y="121.0" text-anchor="middle" class="t">cache</text><text x="255.0" y="139.0" text-anchor="middle" class="s">until the TTL ends</text><rect x="185" y="156" width="140" height="40" rx="8" class="box"/><text x="255.0" y="171.0" text-anchor="middle" class="t">ask upstream</text><text x="255.0" y="189.0" text-anchor="middle" class="s">servers / DHCP / PPP</text><line x1="130" y1="110" x2="170" y2="110" class="ln" marker-end="url(#tce1)"/><line x1="255" y1="96" x2="255" y2="106" class="lm" marker-end="url(#tce1)"/><line x1="255" y1="146" x2="255" y2="156" class="lm" marker-end="url(#tce1)"/><rect x="390" y="150" width="130" height="56" rx="8" class="box"/><text x="455.0" y="173.0" text-anchor="middle" class="t">upstream DNS</text><text x="455.0" y="191.0" text-anchor="middle" class="s">22.1.1.1, 8.8.8.8</text><line x1="325" y1="176" x2="390" y2="176" class="ln" marker-end="url(#tce1)"/><rect x="560" y="150" width="130" height="56" rx="8" class="box"/><text x="625.0" y="173.0" text-anchor="middle" class="t">root → com</text><text x="625.0" y="191.0" text-anchor="middle" class="s">→ example.com</text><line x1="520" y1="178" x2="560" y2="178" class="ld" marker-end="url(#tce1)"/><rect x="390" y="30" width="300" height="80" rx="8" class="wa"/><text x="540.0" y="56.0" text-anchor="middle" class="t">forced DNS (dstnat)</text><text x="540.0" y="74.0" text-anchor="middle" class="s">udp dst-port=53 from the LAN</text><text x="540.0" y="92.0" text-anchor="middle" class="s">action=redirect to-ports=53</text><path d="M130,92 C150,60 160,50 185,48" class="ld" marker-end="url(#tce1)"/><text x="10" y="222" text-anchor="start" class="s">The answer is stored in the cache, so the next client gets it at once</text></svg>