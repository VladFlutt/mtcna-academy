<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="sans-serif"><defs><marker id="tce2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="20" y="10" width="160" height="44" rx="8" class="box"/><text x="100.0" y="27.0" text-anchor="middle" class="t">Client</text><text x="100.0" y="45.0" text-anchor="middle" class="s">0.0.0.0 : 68</text><rect x="520" y="10" width="160" height="44" rx="8" class="rt"/><text x="600.0" y="27.0" text-anchor="middle" class="t">DHCP server</text><text x="600.0" y="45.0" text-anchor="middle" class="s">192.168.33.1 : 67</text><line x1="100" y1="54" x2="100" y2="290" class="lm"/><line x1="600" y1="54" x2="600" y2="290" class="lm"/><line x1="100" y1="90" x2="598" y2="90" class="ln" marker-end="url(#tce2)"/><text x="350" y="82" text-anchor="middle" class="t">DISCOVER</text><text x="350" y="106" text-anchor="middle" class="s">broadcast: who can give me an address?</text><line x1="600" y1="140" x2="102" y2="140" class="ln" marker-end="url(#tce2)"/><text x="350" y="132" text-anchor="middle" class="t">OFFER</text><text x="350" y="156" text-anchor="middle" class="s">192.168.33.10, mask, gateway, DNS, lease</text><line x1="100" y1="190" x2="598" y2="190" class="ln" marker-end="url(#tce2)"/><text x="350" y="182" text-anchor="middle" class="t">REQUEST</text><text x="350" y="206" text-anchor="middle" class="s">broadcast: I take the offer of 192.168.33.1</text><line x1="600" y1="240" x2="102" y2="240" class="ln" marker-end="url(#tce2)"/><text x="350" y="232" text-anchor="middle" class="t">ACK</text><text x="350" y="256" text-anchor="middle" class="s">confirmed: the address, the options and the lease time</text><text x="350" y="292" text-anchor="middle" class="s">T1 at 50%: renew (unicast to the server) · T2 at 87.5%: rebind (broadcast) · DECLINE, NAK, RELEASE</text></svg>