<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" font-family="sans-serif"><defs><marker id="tce3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="10" y="70" width="130" height="60" rx="8" class="box"/><text x="75.0" y="95.0" text-anchor="middle" class="t">Client</text><text x="75.0" y="113.0" text-anchor="middle" class="s">broadcast DISCOVER</text><rect x="200" y="50" width="180" height="100" rx="8" class="rt"/><text x="290.0" y="77.0" text-anchor="middle" class="t">DHCP relay</text><text x="290.0" y="95.0" text-anchor="middle" class="s">interface=bridgeLAN</text><text x="290.0" y="113.0" text-anchor="middle" class="s">local-address=192.168.33.1</text><text x="290.0" y="131.0" text-anchor="middle" class="s">dhcp-server=22.1.1.10</text><rect x="470" y="50" width="220" height="100" rx="8" class="ok"/><text x="580.0" y="77.0" text-anchor="middle" class="t">DHCP server</text><text x="580.0" y="95.0" text-anchor="middle" class="s">relay=192.168.33.1</text><text x="580.0" y="113.0" text-anchor="middle" class="s">pool for 192.168.33.0/24</text><text x="580.0" y="131.0" text-anchor="middle" class="s">network 192.168.33.0/24</text><line x1="140" y1="100" x2="200" y2="100" class="ln" marker-end="url(#tce3)"/><line x1="380" y1="90" x2="470" y2="90" class="ln" marker-end="url(#tce3)"/><text x="425" y="80" text-anchor="middle" class="s">unicast, giaddr</text><line x1="470" y1="115" x2="380" y2="115" class="ln" marker-end="url(#tce3)"/><text x="425" y="135" text-anchor="middle" class="s">OFFER / ACK</text><text x="350" y="190" text-anchor="middle" class="s">The server chooses the pool by the relay address (giaddr); option 82 can add the port of the client</text></svg>