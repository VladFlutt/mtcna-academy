<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" font-family="sans-serif"><defs><marker id="tce5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="10" y="75" width="120" height="60" rx="8" class="box"/><text x="70.0" y="100.0" text-anchor="middle" class="t">Browser</text><text x="70.0" y="118.0" text-anchor="middle" class="s">no proxy set</text><rect x="180" y="20" width="200" height="170" rx="8" class="rt"/><text x="280" y="42" text-anchor="middle" class="t">Router</text><rect x="195" y="56" width="170" height="44" rx="8" class="wa"/><text x="280.0" y="73.0" text-anchor="middle" class="t">dstnat tcp 80</text><text x="280.0" y="91.0" text-anchor="middle" class="s">redirect to-ports=8080</text><rect x="195" y="116" width="170" height="60" rx="8" class="ok"/><text x="280.0" y="132.0" text-anchor="middle" class="t">web proxy :8080</text><text x="280.0" y="150.0" text-anchor="middle" class="s">access → cache →</text><text x="280.0" y="168.0" text-anchor="middle" class="s">direct / parent</text><line x1="130" y1="100" x2="195" y2="80" class="ln" marker-end="url(#tce5)"/><line x1="280" y1="100" x2="280" y2="116" class="lm" marker-end="url(#tce5)"/><rect x="450" y="30" width="240" height="50" rx="8" class="no"/><text x="570.0" y="50.0" text-anchor="middle" class="t">deny</text><text x="570.0" y="68.0" text-anchor="middle" class="s">error page or redirect-to</text><rect x="450" y="100" width="240" height="40" rx="8" class="ok"/><text x="570.0" y="115.0" text-anchor="middle" class="t">cache hit</text><text x="570.0" y="133.0" text-anchor="middle" class="s">answer from the cache (DSCP 4)</text><rect x="450" y="150" width="240" height="50" rx="8" class="box"/><text x="570.0" y="170.0" text-anchor="middle" class="t">cache miss</text><text x="570.0" y="188.0" text-anchor="middle" class="s">proxy fetches the page (output chain)</text><line x1="365" y1="130" x2="450" y2="60" class="ln" marker-end="url(#tce5)"/><line x1="365" y1="140" x2="450" y2="120" class="ln" marker-end="url(#tce5)"/><line x1="365" y1="155" x2="450" y2="172" class="ln" marker-end="url(#tce5)"/></svg>