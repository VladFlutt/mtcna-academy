<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" font-family="sans-serif"><defs><marker id="tce4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="350" y="24" text-anchor="middle" class="t">0x 10 0A 27 0A 26 01 01  =  10.39.0.0/16 via 10.38.1.1</text><rect x="60" y="44" width="134" height="64" rx="8" class="rt"/><text x="127.0" y="71.0" text-anchor="middle" class="t">10</text><text x="127.0" y="89.0" text-anchor="middle" class="s">length 16</text><rect x="214" y="44" width="170" height="64" rx="8" class="ok"/><text x="299.0" y="71.0" text-anchor="middle" class="t">0A 27</text><text x="299.0" y="89.0" text-anchor="middle" class="s">10.39 (2 octets)</text><rect x="404" y="44" width="242" height="64" rx="8" class="wa"/><text x="525.0" y="71.0" text-anchor="middle" class="t">0A 26 01 01</text><text x="525.0" y="89.0" text-anchor="middle" class="s">gateway 10.38.1.1</text><text x="350" y="136" text-anchor="middle" class="s">Only the significant octets of the network are sent: /8 → 1, /16 → 2, /24 → 3, /32 → 4, /0 → none</text><text x="350" y="156" text-anchor="middle" class="s">Default route: 00 + gateway, for example 00 C0 A8 21 01 = 0.0.0.0/0 via 192.168.33.1</text></svg>